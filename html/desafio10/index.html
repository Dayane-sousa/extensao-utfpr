<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model</title>
    <style>
        li{
            display: inline;
            background-color: pink;
            margin: 10px;
            border-radius: 50px;
            padding: 10px;
        }

        ol>li{
            display: block;
            background-color:pink;
            margin: 10px;
            border-radius: 50px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Display inline</h1>
    <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ul>

    <h1>Display block</h1>
    <ol>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>
    <h1>display </h1>
</body>
</html>
